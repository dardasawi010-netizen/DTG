<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماريو الواقعية - 10 مراحل</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h1 {
            font-size: 15px;
            margin: 4px 0;
            color: #f1c40f;
            text-transform: uppercase;
        }
        .ui-panel {
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto 5px auto;
            font-size: 12px;
            background: #1f2937;
            padding: 6px;
            border: 2px solid #374151;
            border-radius: 4px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid #4b5563;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }
        canvas {
            image-rendering: pixelated;
            display: block;
            width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 10px auto 0 auto;
            padding: 0 5px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: #374151;
            border: 2px solid #9ca3af;
            color: #fff;
            font-size: 20px;
            width: 55px;
            height: 55px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .control-btn:active {
            background: #4b5563;
        }
        .jump-btn {
            background: #065f46;
            border-color: #34d399;
            width: 70px;
            height: 70px;
            border-radius: 50%;
        }
        /* زر إعادة اللعبة */
        #restartBtn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e74c3c;
            color: white;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }
        #restartBtn:active {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <h1>🍄 مغامرة ماريو الواقعية - 10 مراحل 🍄</h1>
    <div class="ui-panel">
        <div>المرحلة: <span id="stageNum">1</span>/10</div>
        <div>❤️ القلوب: <span id="lives">3</span></div>
        <div>💰 العملات: <span id="coins">0</span></div>
        <div>🏆 النقاط: <span id="score">0</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="512" height="288"></canvas>
        <button id="restartBtn" onclick="restartGame()">إعادة اللعبة 🔄</button>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
        <div class="btn-group">
            <button class="control-btn jump-btn" id="jumpBtn">🚀</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const stageNumEl = document.getElementById("stageNum");
        const livesEl = document.getElementById("lives");
        const coinsEl = document.getElementById("coins");
        const scoreEl = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let currentStage = 1;
        let gameState = "PLAYING"; // PLAYING, GAMEOVER, WIN_ALL

        let player = {
            x: 32,
            y: 150,
            width: 16,
            height: 24,
            speed: 3,
            dx: 0,
            dy: 0,
            jumpPower: -8.5,
            grounded: false
        };

        const gravity = 0.4;
        let keys = {};

        function loadStage(stage) {
            player.x = 32;
            player.y = 150;
            player.dy = 0;

            let platforms = [
                { x: 0, y: 256, width: 800 + (stage * 50), height: 32, type: "ground" }
            ];

            let luckyCount = 2 + Math.floor(stage / 2);
            for (let i = 0; i < luckyCount; i++) {
                platforms.push({
                    x: 120 + (i * 100),
                    y: 190 - (i % 2) * 30,
                    width: 32,
                    height: 16,
                    type: "lucky",
                    opened: false
                });
            }

            let collectables = [];
            for (let i = 0; i < 3 + stage; i++) {
                collectables.push({
                    x: 100 + (i * 70),
                    y: 130,
                    radius: 6,
                    collected: false
                });
            }

            let enemies = [];
            let enemyCount = Math.min(1 + Math.floor(stage / 2), 4);
            for (let i = 0; i < enemyCount; i++) {
                enemies.push({
                    x: 200 + (i * 120),
                    y: 240,
                    width: 16,
                    height: 16,
                    speed: 1 + (stage * 0.2),
                    minX: 180 + (i * 120),
                    maxX: 280 + (i * 120),
                    dir: 1
                });
            }

            let goal = { x: 750 + (stage * 40), y: 192, width: 16, height: 64 };

            return { platforms, collectables, enemies, goal };
        }

        let currentWorld = loadStage(currentStage);

        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded && gameState === "PLAYING") jump();
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        const setupTouch = (id, code) => {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; if(id === 'jumpBtn' && player.grounded && gameState === 'PLAYING') jump(); });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
            btn.addEventListener("mousedown", () => { keys[code] = true; if(id === 'jumpBtn' && player.grounded && gameState === 'PLAYING') jump(); });
            btn.addEventListener("mouseup", () => { keys[code] = false; });
        };
        setupTouch("leftBtn", "ArrowLeft");
        setupTouch("rightBtn", "ArrowRight");
        setupTouch("jumpBtn", "Space");

        function jump() {
            player.dy = player.jumpPower;
            player.grounded = false;
        }

        function restartGame() {
            score = 0;
            coins = 0;
            lives = 3;
            currentStage = 1;
            gameState = "PLAYING";
            scoreEl.innerText = score;
            coinsEl.innerText = coins;
            livesEl.innerText = lives;
            stageNumEl.innerText = currentStage;
            restartBtn.style.display = "none";
            currentWorld = loadStage(currentStage);
        }

        function update() {
            if (gameState !== "PLAYING") return;

            if (keys["ArrowRight"]) player.dx = player.speed;
            else if (keys["ArrowLeft"]) player.dx = -player.speed;
            else player.dx = 0;

            player.dy += gravity;
            player.x += player.dx;
            player.y += player.dy;

            if (player.x < 0) player.x = 0;

            player.grounded = false;
            currentWorld.platforms.forEach(plat => {
                if (
                    player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height - player.dy <= plat.y
                ) {
                    player.dy = 0;
                    player.y = plat.y - player.height;
                    player.grounded = true;

                    if (plat.type === "lucky" && !plat.opened) {
                        plat.opened = true;
                        coins += 2;
                        score += 100;
                        coinsEl.innerText = coins;
                        scoreEl.innerText = score;
                    }
                }
            });

            currentWorld.collectables.forEach(item => {
                if (!item.collected) {
                    let dist = Math.hypot((player.x + 8) - item.x, (player.y + 12) - item.y);
                    if (dist < 16) {
                        item.collected = true;
                        coins += 1;
                        score += 25;
                        coinsEl.innerText = coins;
                        scoreEl.innerText = score;
                    }
                }
            });

            currentWorld.enemies.forEach(enemy => {
                enemy.x += enemy.speed * enemy.dir;
                if (enemy.x < enemy.minX || enemy.x > enemy.maxX) enemy.dir *= -1;

                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= enemy.y + 6) {
                        currentWorld.enemies = currentWorld.enemies.filter(e => e !== enemy);
                        score += 150;
                        scoreEl.innerText = score;
                        player.dy = -5;
                    } else {
                        lives--;
                        livesEl.innerText = lives;
                        player.x = 32;
                        player.y = 150;
                        if (lives <= 0) {
                            gameState = "GAMEOVER";
                            restartBtn.style.display = "block";
                        }
                    }
                }
            });

            let goal = currentWorld.goal;
            if (
                player.x < goal.x + goal.width &&
                player.x + player.width > goal.x &&
                player.y < goal.y + goal.height &&
                player.y + player.height > goal.y
            ) {
                if (currentStage < 10) {
                    currentStage++;
                    stageNumEl.innerText = currentStage;
                    currentWorld = loadStage(currentStage);
                } else {
                    gameState = "WIN_ALL";
                }
            }

            if (player.y > canvas.height) {
                lives--;
                livesEl.innerText = lives;
                player.x = 32;
                player.y = 150;
                player.dy = 0;
                if (lives <= 0) {
                    gameState = "GAMEOVER";
                    restartBtn.style.display = "block";
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let cameraX = -player.x + 100;
            if (cameraX > 0) cameraX = 0;
            ctx.translate(cameraX, 0);

            ctx.fillStyle = currentStage % 2 === 0 ? "#111827" : "#1f1f2e";
            ctx.fillRect(-cameraX, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#8b5cf6";
            ctx.fillRect(currentWorld.goal.x, currentWorld.goal.y, currentWorld.goal.width, currentWorld.goal.height);

            currentWorld.platforms.forEach(plat => {
                if (plat.type === "ground") {
                    ctx.fillStyle = "#059669";
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = "#10b981";
                    ctx.fillRect(plat.x, plat.y, plat.width, 4);
                } else {
                    ctx.fillStyle = plat.opened ? "#4b5563" : "#f59e0b";
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    if (!plat.opened) {
                        ctx.fillStyle = "#fff";
                        ctx.font = "bold 10px Courier New";
                        ctx.fillText("?", plat.x + 5, plat.y + 12);
                    }
                }
            });

            currentWorld.collectables.forEach(item => {
                if (!item.collected) {
                    ctx.fillStyle = "#fbbf24";
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            currentWorld.enemies.forEach(enemy => {
                ctx.fillStyle = "#dc2626";
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });

            // رسم ماريو الواقعي (أحمر وأزرق)
            ctx.fillStyle = "#e52521"; // قميص ماريو الأحمر
            ctx.fillRect(player.x, player.y + 6, player.width, player.height - 6);
            ctx.fillStyle = "#002fbe"; // بنطال ماريو الأزرق
            ctx.fillRect(player.x + 2, player.y + 14, player.width - 4, 10);
            ctx.fillStyle = "#e52521"; // القبعة
            ctx.fillRect(player.x, player.y, player.width, 6);

            ctx.restore();

            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 16px Courier New";
                ctx.fillText("لقد خسرت يا اهبل", 135, 120);
            } else if (gameState === "WIN_ALL") {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#10b981";
                ctx.font = "bold 14px Courier New";
                ctx.fillText("أنهيت الـ 10 مراحل بنجاح! 🎉", 130, 140);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
