<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الدردشة - TrucksApp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background-color: #075e54;
      color: #ffffff;
      padding: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .username-bar {
      background: #128c7e;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
    }
    .username-bar input {
      flex: 1;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      background-color: #efeae2;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 0.95rem;
      color: #333333;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }
    .message.my-message {
      background-color: #dcf8c6;
      align-self: flex-end;
    }
    .message .sender-name {
      font-size: 0.75rem;
      font-weight: bold;
      color: #075e54;
      margin-bottom: 2px;
    }
    .chat-input-area {
      display: flex;
      padding: 10px;
      background-color: #f0f0f0;
      border-top: 1px solid #cccccc;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 1rem;
      margin-left: 8px;
    }
    .chat-input-area button {
      background-color: #075e54;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .chat-input-area button:hover {
      background-color: #128c7e;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">تطبيق TrucksApp للمراسلة</div>
    <div class="username-bar">
      <input type="text" id="username-input" placeholder="اكتب اسمك هنا (مثالي: سائق 1)" value="مستخدم">
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input-area">
      <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
      <button id="send-btn">إرسال</button>
    </div>
  </div>

  <!-- مكتبات Firebase Mappers المعتمدة للمتصفح مباشرة -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // إعدادات الربط الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBVrJk-B6COMjBWhXXhie-NpZihWLG8RSk",
      authDomain: "trucksapp-24ad7.firebaseapp.com",
      projectId: "trucksapp-24ad7",
      storageBucket: "trucksapp-24ad7.firebasestorage.app",
      messagingSenderId: "254565994313",
      appId: "1:254565994313:web:5df17e62fb68d94a9dd498",
      measurementId: "G-Z5K2C79V50",
      databaseURL: "https://trucksapp-24ad7-default-rtdb.firebaseio.com"
    };

    // تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const messagesRef = database.ref('messages');

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username-input');
    const sendBtn = document.getElementById('send-btn');

    // دالة إرسال الرسالة
    function sendMessage() {
      const text = messageInput.value.trim();
      const sender = usernameInput.value.trim() || "مستخدم مجهول";

      if (text !== "") {
        messagesRef.push({
          sender: sender,
          text: text,
          timestamp: Date.now()
        });
        messageInput.value = "";
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // الاستماع للرسائل في الوقت الفعلي
    messagesRef.on('child_added', (snapshot) => {
      const msg = snapshot.val();
      const currentSender = usernameInput.value.trim() || "مستخدم مجهول";
      
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      
      // إذا كانت الرسالة من صاحب الجهاز تظهر باللون الأخضر على اليسار
      if (msg.sender === currentSender) {
        msgDiv.classList.add('my-message');
      }

      const senderDiv = document.createElement('div');
      senderDiv.classList.add('sender-name');
      senderDiv.textContent = msg.sender || "مستخدم";

      const textDiv = document.createElement('div');
      textDiv.textContent = msg.text;

      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(textDiv);
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>

</body>
</html>
