<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ماريو المصغرة</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #5c94fc; /* لون سماء ماريو الكلاسيكي */
            display: block;
            margin: 20px auto;
            border: 4px solid #fff;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        .instructions {
            font-size: 16px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <h1>لعبة ماريو المصغرة</h1>
    <div class="instructions">
        استخدم <strong>السهم الأيمن والأيسر</strong> للحركة، ومفتاح <strong>السهم الأيمن + المسافة</strong> أو <strong>السهم الأعلى (↑)</strong> للقفز!
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // خصائص اللاعب (ماريو)
        let mario = {
            x: 50,
            y: 200,
            width: 30,
            height: 40,
            speed: 4,
            dx: 0,
            dy: 0,
            jumpPower: -10,
            grounded: false,
            color: "#e52521" // أحمر ماريو
        };

        // الجاذبية والبيئة
        const gravity = 0.5;
        
        // المنصات والعوائق
        let platforms = [
            { x: 0, y: 350, width: 800, height: 50, color: "#00a800" }, // الأرضية
            { x: 300, y: 250, width: 150, height: 20, color: "#c84c0c" }, // منصة 1
            { x: 550, y: 180, width: 120, height: 20, color: "#c84c0c" }  // منصة 2
        ];

        // تتبع الأزرار المضغوطة
        let keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            // القفز عند الضغط على المسافة أو السهم لأعلى
            if ((e.code === "Space" || e.code === "ArrowUp") && mario.grounded) {
                mario.dy = mario.jumpPower;
                mario.grounded = false;
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function update() {
            // التحكم الأفقي
            if (keys["ArrowRight"]) {
                mario.dx = mario.speed;
            } else if (keys["ArrowLeft"]) {
                mario.dx = -mario.speed;
            } else {
                mario.dx = 0;
            }

            // تطبيق الجاذبية
            mario.dy += gravity;

            // تحديث موقع ماريو
            mario.x += mario.dx;
            mario.y += mario.dy;

            // الحدود الجانبية للشاشة
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            // فحص الاصطدام بالمنصات والأرض
            mario.grounded = false;
            platforms.forEach(plat => {
                // اصطدام من الأعلى
                if (
                    mario.x < plat.x + plat.width &&
                    mario.x + mario.width > plat.x &&
                    mario.y + mario.height >= plat.y &&
                    mario.y + mario.height - mario.dy <= plat.y
                ) {
                    mario.dy = 0;
                    mario.y = plat.y - mario.height;
                    mario.grounded = true;
                }
            });

            // إذا سقط خارج الشاشة (خسارة)
            if (mario.y > canvas.height) {
                resetGame();
            }
        }

        function resetGame() {
            mario.x = 50;
            mario.y = 200;
            mario.dy = 0;
        }

        function draw() {
            // مسح الشاشة لتحديث الإطار
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم المنصات والأرضية
            platforms.forEach(plat => {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            // رسم ماريو (مربع أحمر يمثل الشخصية)
            ctx.fillStyle = mario.color;
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
            
            // رسم قبعة أو تفصيلة بسيطة لماريو
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(mario.x + 5, mario.y + 5, 10, 5);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // بدء اللعبة
        loop();
    </script>

</body>
</html>
