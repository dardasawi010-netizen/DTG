<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الديناصور - انقطاع الإنترنت</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #f7f7f7;
            color: #535353;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #333;
        }
        .score-board {
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-bottom: 2px solid #535353;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
        }
        /* زر إعادة اللعبة */
        #restartBtn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #535353;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
        }
        #restartBtn:active {
            background: #333;
        }
        .instructions {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>🌵 لعبة الديناصور الشهيرة (بدون إنترنت) 🌵</h1>
    <div class="score-board">النقاط: <span id="score">0</span></div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="200"></canvas>
        <button id="restartBtn" onclick="restartGame()">إعادة المحاولة 🔄</button>
    </div>

    <div class="instructions">
        اضغط على <strong>المسافة (Space)</strong> أو انقر على الشاشة للقفز فوق الصبار!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");

        let score = 0;
        let gameSpeed = 5;
        let gameState = "PLAYING"; // PLAYING, GAMEOVER

        // خصائص الديناصور
        let dino = {
            x: 50,
            y: 140,
            width: 30,
            height: 40,
            dy: 0,
            jumpPower: -10,
            gravity: 0.6,
            grounded: true
        };

        // مصفوفة العوائق (الصبار)
        let obstacles = [];
        let obstacleTimer = 0;

        // تبيين أزرار التحكم
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                jump();
            }
        });

        // دعم اللمس للتحكم عبر الهاتف
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            jump();
        });

        function jump() {
            if (dino.grounded && gameState === "PLAYING") {
                dino.dy = dino.jumpPower;
                dino.grounded = false;
            }
        }

        function restartGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            obstacleTimer = 0;
            dino.y = 140;
            dino.dy = 0;
            dino.grounded = true;
            gameState = "PLAYING";
            restartBtn.style.display = "none";
            scoreEl.innerText = score;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            // زيادة النقاط والسرعة تدريجياً
            score++;
            if (score % 100 === 0) {
                gameSpeed += 0.5;
            }
            scoreEl.innerText = Math.floor(score / 5);

            // تطبيق الجاذبية على الديناصور
            dino.dy += dino.gravity;
            dino.y += dino.dy;

            // منع الديناصور من السقوط تحت الأرض
            if (dino.y > 140) {
                dino.y = 140;
                dino.dy = 0;
                dino.grounded = true;
            }

            // توليد الصبار (العوائق)
            obstacleTimer++;
            if (obstacleTimer > Math.random() * 50 + 70) {
                obstacles.push({
                    x: canvas.width,
                    y: 145,
                    width: 20,
                    height: 35
                });
                obstacleTimer = 0;
            }

            // تحريك الصبار والتحقق من الاصطدام
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // فحص الاصطدام بدقة (Hitbox)
                if (
                    dino.x < obstacles[i].x + obstacles[i].width &&
                    dino.x + dino.width > obstacles[i].x &&
                    dino.y < obstacles[i].y + obstacles[i].height &&
                    dino.y + dino.height > obstacles[i].y
                ) {
                    gameState = "GAMEOVER";
                    restartBtn.style.display = "block";
                }

                // إزالة الصبار الذي خرج من الشاشة
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            // مسح الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم خط الأرض
            ctx.strokeStyle = "#535353";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 180);
            ctx.lineTo(canvas.width, 180);
            ctx.stroke();

            // رسم الديناصور (مربع كلاسيكي بلون رمادي داكن يماثل تصميم المتصفح)
            ctx.fillStyle = "#535353";
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            // تفصيل رأس الديناصور البكسلي
            ctx.fillRect(dino.x + 20, dino.y - 8, 12, 12);
            ctx.fillStyle = "#fff"; // العين
            ctx.fillRect(dino.x + 26, dino.y - 4, 3, 3);

            // رسم الصبار
            ctx.fillStyle = "#535353";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // شاشة الخسارة مع الجملة المطلوبة
            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#535353";
                ctx.font = "bold 20px 'Courier New'";
                ctx.fillText("لقد خسرت يا اهبل", canvas.width / 2 - 110, canvas.height / 2 - 15);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
