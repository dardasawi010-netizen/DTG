<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counter-Strike Pixel - Joystick & Touch Look</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 8px solid #475569;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            color: white;
            padding: 20px;
        }
        h1 {
            font-size: 45px;
            color: #facc15;
            margin-bottom: 5px;
            text-shadow: 4px 4px 0px #000;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .menu-btn {
            background: #16a34a;
            color: white;
            border: 4px solid #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 5px 0px #14532d;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #14532d;
        }
        .options-box {
            background: #020617;
            padding: 15px 20px;
            border: 4px solid #334155;
            margin-bottom: 15px;
            text-align: right;
            max-width: 400px;
            width: 100%;
        }
        .select-group {
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #cbd5e1;
            font-weight: bold;
        }
        select {
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            border: 3px solid #000;
            outline: none;
        }

        #gameUI {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-top {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 0 15px;
            pointer-events: none;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
        }
        .hud-box {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            background: #0f172a;
            padding: 5px 10px;
            border: 3px solid #000;
            box-shadow: 0 3px 0px #000;
        }
        .bar-container {
            width: 100%;
            max-width: 450px;
            height: 14px;
            background: #020617;
            border: 3px solid #000;
            overflow: hidden;
        }
        #hpBar {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.1s steps(10);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
            z-index: 25;
        }

        /* عصا التحكم (Joystick) في اليسار */
        #joystickBase {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(30, 41, 59, 0.6);
            border: 4px solid #475569;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 20;
            touch-action: none;
        }
        #joystickKnob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #38bdf8;
            border: 3px solid #000;
            border-radius: 50%;
            pointer-events: none;
        }

        /* أزرار العمليات يمين الشاشة */
        .action-btns {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 20;
        }
        .ctrl-btn {
            background: #1e293b;
            border: 4px solid #000;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #000;
            background: #334155;
        }
        #shootBtn { background: #dc2626; width: 80px; height: 80px; }
        #jumpBtn { background: #0284c7; width: 65px; height: 65px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mainMenu" class="screen">
        <h1>CS: JOYSTICK EDITION</h1>
        <div class="subtitle">عصا تحكم يسارية + تحريك الشاشة باللمس</div>
        
        <div class="options-box">
            <div class="select-group">
                <label>🔫 السلاح:</label>
                <select id="weaponSelect">
                    <option value="ak47">AK-47 Classic</option>
                    <option value="m4a1">M4A1 Carbine</option>
                    <option value="awp">AWP Sniper</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔥 الصعوبة:</label>
                <select id="difficultySelect">
                    <option value="normal" selected>عادي (Normal)</option>
                    <option value="hard">صعب (Hard)</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔊 الأصوات:</label>
                <select id="audioSelect" onchange="toggleAudio(this.value)">
                    <option value="on">مفعل</option>
                    <option value="off">صامت</option>
                </select>
            </div>
        </div>

        <button class="menu-btn" onclick="startGame()">بدء اللعبة (PLAY) 💥</button>
    </div>

    <div id="gameUI">
        <div class="hud-top">
            <div class="hud-row">
                <div class="hud-box">القتلى: <span id="score">0</span></div>
                <div class="hud-box" id="weaponHud">AK-47</div>
            </div>
            <div style="width: 100%; max-width: 450px; text-align: right; font-size: 10px; color: #fff; font-weight: bold;">صحة اللاعب (HP) - اقتل عدواً يعود دمك 100%!</div>
            <div class="bar-container"><div id="hpBar"></div></div>
        </div>

        <div id="crosshair">+</div>

        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>

        <div class="action-btns">
            <button class="ctrl-btn" id="jumpBtn" onclick="jumpPlayer()">⬆ قفز</button>
            <button class="ctrl-btn" id="shootBtn" onclick="shoot()">🔥 أطلق</button>
        </div>
    </div>

    <div id="gameOverScreen" class="screen" style="display: none; background: #450a0a;">
        <h1 style="color: #f87171;">تم القضاء عليك!</h1>
        <p id="finalScoreText" style="font-size: 18px; margin-bottom: 20px; color: #fef08a; font-weight: bold;"></p>
        <button class="menu-btn" style="background: #ca8a04;" onclick="returnToMenu()">إعادة المحاولة 🔄</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-cute.mp3" type="audio/mp3">
    </audio>

    <script>
        let scene, camera, renderer;
        let enemies = [];
        let score = 0;
        let playerHp = 100;
        let difficultyMultiplier = 1.0;
        let isGameOver = false;
        let audioEnabled = true;
        let gunMesh = null;
        let playerAngle = 0;
        let currentWeapon = 'ak47';
        let isJumping = false;

        // متغيرات عصا التحكم (Joystick)
        let joystickActive = false;
        let joystickX = 0, joystickY = 0;

        // متغيرات تحريك الشاشة باللمس
        let isLooking = false;
        let lastTouchX = 0;

        const bgMusic = document.getElementById("bgMusic");
        bgMusic.volume = 0.2;

        function toggleAudio(val) {
            audioEnabled = (val === "on");
            if(audioEnabled) bgMusic.play().catch(() => {});
            else bgMusic.pause();
        }

        function startGame() {
            const diff = document.getElementById("difficultySelect").value;
            difficultyMultiplier = (diff === 'hard') ? 1.5 : 1.0;

            currentWeapon = document.getElementById("weaponSelect").value;
            document.getElementById("weaponHud").innerText = document.getElementById("weaponSelect").options[document.getElementById("weaponSelect").selectedIndex].text;

            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});

            if (!scene) {
                init3D();
                initControls();
            } else {
                resetGameData();
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 5);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            // الأرضية
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createMapObstacles();
            updateGunModel();

            for (let i = 0; i < 5; i++) {
                createEnemy();
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function initControls() {
            const base = document.getElementById('joystickBase');
            const knob = document.getElementById('joystickKnob');
            const baseRect = base.getBoundingClientRect();
            const centerX = baseRect.width / 2;
            const centerY = baseRect.height / 2;

            // تحكم عصا اليسار (Joystick)
            base.addEventListener('touchstart', (e) => { joystickActive = true; handleJoystick(e); });
            base.addEventListener('touchmove', (e) => { if(joystickActive) handleJoystick(e); });
            base.addEventListener('touchend', () => {
                joystickActive = false;
                joystickX = 0; joystickY = 0;
                knob.style.transform = `translate(0px, 0px)`;
            });

            function handleJoystick(e) {
                const touch = e.touches[0];
                const rect = base.getBoundingClientRect();
                let x = touch.clientX - rect.left - centerX;
                let y = touch.clientY - rect.top - centerY;
                
                const distance = Math.sqrt(x * x + y * y);
                const maxRadius = 40;

                if (distance > maxRadius) {
                    x = (x / distance) * maxRadius;
                    y = (y / distance) * maxRadius;
                }

                knob.style.transform = `translate(${x}px, ${y}px)`;
                joystickX = x / maxRadius;
                joystickY = y / maxRadius;
            }

            // تحريك الشاشة يميناً ويساراً عن طريق لمس الشاشة العلوية
            window.addEventListener('touchstart', (e) => {
                // إذا لم يكن اللمس على أزرار الأكشن أو عصا التحكم
                if (e.touches[0].clientX > window.innerWidth * 0.35 && e.touches[0].clientY < window.innerHeight * 0.75) {
                    isLooking = true;
                    lastTouchX = e.touches[0].clientX;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (isLooking) {
                    let currentX = e.touches[0].clientX;
                    let deltaX = currentX - lastTouchX;
                    playerAngle -= deltaX * 0.005; // الالتفاف بسلاسة مع السحب
                    camera.rotation.y = playerAngle;
                    lastTouchX = currentX;
                }
            });

            window.addEventListener('touchend', () => {
                isLooking = false;
            });
        }

        function createMapObstacles() {
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
            for (let i = -30; i <= 30; i += 15) {
                if(i === 0) continue;
                const boxGeo = new THREE.BoxGeometry(4, 4, 4);
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(i, 2, -15);
                scene.add(box);
            }
        }

        function updateGunModel() {
            if (gunMesh) camera.remove(gunMesh);
            const gunGeo = new THREE.BoxGeometry(0.25, 0.25, 1.1);
            const gunMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
            gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.35, -0.3, -0.6);
            camera.add(gunMesh);
            scene.add(camera);
        }

        function createEnemy() {
            const group = new THREE.Group();
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            group.add(head);

            const bodyGeo = new THREE.BoxGeometry(0.8, 1.0, 0.5);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0xb45309 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            group.add(body);

            group.position.x = (Math.random() - 0.5) * 30;
            group.position.y = 0;
            group.position.z = -Math.random() * 20 - 10;

            group.baseSpeed = (0.02 + Math.random() * 0.01) * difficultyMultiplier;
            scene.add(group);
            enemies.push(group);
        }

        function jumpPlayer() {
            if (isJumping) return;
            isJumping = true;
            camera.position.y = 3.2;
            setTimeout(() => {
                camera.position.y = 1.8;
                isJumping = false;
            }, 350);
        }

        function shoot() {
            if (isGameOver) return;

            if (gunMesh) {
                gunMesh.position.z += 0.15;
                setTimeout(() => gunMesh.position.z -= 0.15, 70);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                if (camera.position.distanceTo(enemy.position) < 25) {
                    // دمك يعود فل 100% فوراً عند كل قتلة ناجحة!
                    playerHp = 100;
                    document.getElementById("hpBar").style.width = "100%";

                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    
                    score += 1;
                    document.getElementById("score").innerText = score;

                    setTimeout(createEnemy, 400);
                    break;
                }
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // تطبيق حركة عصا التحكم (Joystick) لتتحرك للأمام والخلف واليمين واليسار
            if (joystickActive) {
                const moveSpeed = 0.08;
                camera.position.x -= (Math.sin(playerAngle) * joystickY + Math.cos(playerAngle) * joystickX) * moveSpeed;
                camera.position.z -= (Math.cos(playerAngle) * joystickY - Math.sin(playerAngle) * joystickX) * moveSpeed;
            }

            // الأعداء يتقدمون نحوك ويهجمون عليك باستمرار
            enemies.forEach(enemy => {
                enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
                enemy.translateZ(enemy.baseSpeed);

                if (camera.position.distanceTo(enemy.position) < 1.7) {
                    playerHp -= 0.8 * difficultyMultiplier;
                    document.getElementById("hpBar").style.width = Math.max(0, playerHp) + "%";

                    if (playerHp <= 0) {
                        triggerGameOver();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            bgMusic.pause();
            document.getElementById("gameUI").style.display = "none";
            document.getElementById("finalScoreText").innerText = `مجموع الأعداء الذين قضيت عليهم: ${score}`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function resetGameData() {
            isGameOver = false;
            score = 0;
            playerHp = 100;
            playerAngle = 0;
            camera.position.set(0, 1.8, 5);
            camera.rotation.set(0, 0, 0);
            document.getElementById("score").innerText = score;
            document.getElementById("hpBar").style.width = "100%";
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});
            updateGunModel();

            enemies.forEach(enemy => scene.remove(enemy));
            enemies = [];
            for (let i = 0; i < 5; i++) createEnemy();
        }

        function returnToMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
