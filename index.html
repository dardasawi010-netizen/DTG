<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التواصل الاجتماعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12181f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- شاشة إدخال رقم الهاتف --- */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .modal-card {
            background-color: #1e2631;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #2d3748;
        }

        .modal-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #f0f4f8;
        }

        .modal-card p.subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            direction: ltr;
        }

        .phone-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 18px;
            letter-spacing: 2px;
            background-color: #12181f;
            color: #ffffff;
            border: 2px dashed #4a5568;
            border-radius: 8px;
            outline: none;
        }

        .flag-icon {
            width: 32px;
            height: 22px;
            border-radius: 3px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2e7d32;
            color: #ffffff;
        }

        .error-msg {
            color: #e53e3e;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        /* --- صفحة التواصل (تخفى في البدايه) --- */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            flex-direction: column;
            background-color: #1e2631;
            border-right: 1px solid #2d3748;
            border-left: 1px solid #2d3748;
        }

        .app-header {
            padding: 16px;
            background-color: #12181f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3748;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #2e7d32;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .call-actions button {
            background: none;
            border: none;
            color: #38a169;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.received {
            background-color: #2d3748;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.sent {
            background-color: #2e7d32;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 12px;
            background-color: #12181f;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #2d3748;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background-color: #1e2631;
            border: 1px solid #2d3748;
            border-radius: 20px;
            color: white;
            outline: none;
        }

        .send-btn, .mic-btn {
            background: #2e7d32;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
        }

        .mic-btn {
            background-color: #4a5568;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول برقم الهاتف -->
    <div id="login-screen">
        <div class="modal-card">
            <h2>نرجو إدخال رقم هاتفك الأردني</h2>
            <p class="subtitle">(مثال: 07x xxxxxx)</p>

            <div class="input-container">
                <input type="tel" id="phoneNumber" class="phone-input" value="07" maxlength="10">
                <img class="flag-icon" src="https://flagcdn.com/w40/jo.png" alt="علم الأردن">
            </div>

            <div id="errorMsg" class="error-msg">يرجى إدخال رقم أردني صحيح (10 أرقام)</div>

            <button class="btn" onclick="login()">تأكيد والدخول</button>
        </div>
    </div>

    <!-- 2. واجهة التواصل والكلام -->
    <div id="app-screen">
        <div class="app-header">
            <div class="user-info">
                <div class="avatar">👤</div>
                <div>
                    <h4 id="display-user">مستخدم جديد</h4>
                    <small style="color: #38a169;">متصل الآن</small>
                </div>
            </div>
            <div class="call-actions">
                <button title="اتصال صوتي" onclick="startVoiceCall()">📞</button>
                <button title="اتصال فيديو" onclick="startVideoCall()">📹</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message received">أهلاً بك في التطبيق! يمكنك الآن التواصل مع الآخرين كتابياً وصوتياً.</div>
        </div>

        <div class="chat-input-area">
            <button class="mic-btn" onclick="toggleMic()" title="تسجيل صوتي">🎙️</button>
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function login() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const jordanRegex = /^07[789]\d{7}$/;

            if (jordanRegex.test(phone)) {
                errorMsg.style.display = 'none';
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('display-user').innerText = "عضو: " + phone;
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text !== "") {
                const chatBox = document.getElementById('chatBox');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message sent';
                msgDiv.innerText = text;
                chatBox.appendChild(msgDiv);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function startVoiceCall() {
            alert('جاري بدء الاتصال الصوتي...');
        }

        function startVideoCall() {
            alert('جاري بدء اتصال الفيديو...');
        }

        function toggleMic() {
            alert('جاري تسجيل الصوت...');
        }
    </script>

</body>
</html>
