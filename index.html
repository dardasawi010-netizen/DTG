<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS: MAXIMUM BROWSER ENGINE EDITION</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            border: 6px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
            padding: 20px;
        }
        h1 {
            font-size: 38px;
            color: #facc15;
            margin-bottom: 5px;
            text-shadow: 3px 3px 0px #000;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .menu-btn {
            background: #16a34a;
            color: white;
            border: 4px solid #000;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 0px #14532d;
        }
        .menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #14532d;
        }
        .options-box {
            background: #090d16;
            padding: 15px 20px;
            border: 3px solid #1e293b;
            margin-bottom: 15px;
            text-align: right;
            max-width: 400px;
            width: 100%;
        }
        .select-group {
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
            font-weight: bold;
        }
        select {
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            border: 2px solid #000;
            outline: none;
        }

        #gameUI {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-top {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 15px;
            pointer-events: none;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
        }
        .hud-box {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            background: #0f172a;
            padding: 4px 10px;
            border: 2px solid #000;
        }
        .bar-container {
            width: 100%;
            max-width: 450px;
            height: 12px;
            background: #020617;
            border: 2px solid #000;
            overflow: hidden;
        }
        #hpBar {
            width: 100%;
            height: 100%;
            background: #22c55e;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 26px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
            z-index: 25;
        }

        /* عصا التحكم اليسارية (معزولة تماماً) */
        #joystickBase {
            position: absolute;
            bottom: 25px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(15, 23, 42, 0.6);
            border: 4px solid #475569;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 30;
            touch-action: none;
        }
        #joystickKnob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #38bdf8;
            border: 3px solid #000;
            border-radius: 50%;
            pointer-events: none;
        }

        /* أزرار العمليات يمين الشاشة بمعزل تام */
        .action-btns {
            position: absolute;
            bottom: 25px;
            right: 20px;
            display: flex;
            flex-direction: row;
            gap: 15px;
            pointer-events: auto;
            z-index: 30;
        }
        .ctrl-btn {
            background: #1e293b;
            border: 4px solid #000;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #000;
        }
        #shootBtn { background: #dc2626; width: 85px; height: 85px; }
        #jumpBtn { background: #0284c7; width: 65px; height: 65px; margin-top: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mainMenu" class="screen">
        <h1>CS: MAX ENGINE</h1>
        <div class="subtitle">أقصى طاقة تشغيلية وأداء عالي في المتصفح</div>
        
        <div class="options-box">
            <div class="select-group">
                <label>🔫 السلاح:</label>
                <select id="weaponSelect">
                    <option value="ak47">AK-47 Tactical</option>
                    <option value="m4a1">M4A1 Silenced</option>
                    <option value="awp">AWP Magnum</option>
                </select>
            </div>
            <div class="select-group">
                <label>🔥 مستوى الخطر:</label>
                <select id="difficultySelect">
                    <option value="normal" selected>قياسي (Normal)</option>
                    <option value="hard">متطرف (Hard Core)</option>
                </select>
            </div>
        </div>

        <button class="menu-btn" onclick="startGame()">تشغيل المعركة ⚡</button>
    </div>

    <div id="gameUI">
        <div class="hud-top">
            <div class="hud-row">
                <div class="hud-box">القتلى: <span id="score">0</span></div>
                <div class="hud-box" id="weaponHud">AK-47</div>
            </div>
            <div style="width: 100%; max-width: 450px; text-align: right; font-size: 10px; color: #fff; font-weight: bold;">صحة اللاعب (HP) - استعادة تامة فورية عند كل قتلة!</div>
            <div class="bar-container"><div id="hpBar"></div></div>
        </div>

        <div id="crosshair">⌖</div>

        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>

        <div class="action-btns">
            <button class="ctrl-btn" id="jumpBtn" onclick="jumpPlayer()">⬆ قفز</button>
            <button class="ctrl-btn" id="shootBtn" onclick="shoot()">🔥 أطلق</button>
        </div>
    </div>

    <div id="gameOverScreen" class="screen" style="display: none; background: #450a0a;">
        <h1 style="color: #f87171;">نهاية المهمة!</h1>
        <p id="finalScoreText" style="font-size: 18px; margin-bottom: 20px; color: #fef08a; font-weight: bold;"></p>
        <button class="menu-btn" style="background: #ca8a04;" onclick="returnToMenu()">إعادة المحاولة 🔄</button>
    </div>

    <script>
        let scene, camera, renderer;
        let enemies = [];
        let score = 0;
        let playerHp = 100;
        let difficultyMultiplier = 1.0;
        let isGameOver = false;
        let gunMesh = null;
        let playerAngle = 0;
        let playerPitch = 0;
        let isJumping = false;

        let joystickActive = false;
        let joystickX = 0, joystickY = 0;

        let touchId = null;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function startGame() {
            const diff = document.getElementById("difficultySelect").value;
            difficultyMultiplier = (diff === 'hard') ? 1.6 : 1.0;

            document.getElementById("weaponHud").innerText = document.getElementById("weaponSelect").options[document.getElementById("weaponSelect").selectedIndex].text;

            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (!scene) {
                init3D();
                initControls();
            } else {
                resetGameData();
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // أرضية متقدمة
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createMapObstacles();
            updateGunModel();

            for (let i = 0; i < 6; i++) {
                createEnemy();
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function initControls() {
            const base = document.getElementById('joystickBase');
            const knob = document.getElementById('joystickKnob');
            const baseRect = base.getBoundingClientRect();
            const centerX = baseRect.width / 2;
            const centerY = baseRect.height / 2;

            base.addEventListener('touchstart', (e) => { joystickActive = true; handleJoystick(e); });
            base.addEventListener('touchmove', (e) => { if(joystickActive) handleJoystick(e); });
            base.addEventListener('touchend', () => {
                joystickActive = false;
                joystickX = 0; joystickY = 0;
                knob.style.transform = `translate(0px, 0px)`;
            });

            function handleJoystick(e) {
                const touch = e.touches[0];
                const rect = base.getBoundingClientRect();
                let x = touch.clientX - rect.left - centerX;
                let y = touch.clientY - rect.top - centerY;
                
                const distance = Math.sqrt(x * x + y * y);
                const maxRadius = 40;

                if (distance > maxRadius) {
                    x = (x / distance) * maxRadius;
                    y = (y / distance) * maxRadius;
                }

                knob.style.transform = `translate(${x}px, ${y}px)`;
                joystickX = x / maxRadius;
                joystickY = y / maxRadius;
            }

            // تحريك الشاشة الحر تماماً في المساحات الفارغة وسط وشمال الشاشة
            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.clientX > 150 && touch.clientX < window.innerWidth - 170) {
                        if (touchId === null) {
                            touchId = touch.identifier;
                            prevTouchX = touch.clientX;
                            prevTouchY = touch.clientY;
                        }
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let deltaX = touch.clientX - prevTouchX;
                        let deltaY = touch.clientY - prevTouchY;

                        playerAngle -= deltaX * 0.0035;
                        playerPitch -= deltaY * 0.0035;
                        
                        playerPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, playerPitch));

                        camera.rotation.order = "YXZ";
                        camera.rotation.y = playerAngle;
                        camera.rotation.x = playerPitch;

                        prevTouchX = touch.clientX;
                        prevTouchY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                    }
                }
            });
        }

        function createMapObstacles() {
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            for (let i = -35; i <= 35; i += 12) {
                if(i === 0) continue;
                const boxGeo = new THREE.BoxGeometry(4, 5, 4);
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(i, 2.5, -18);
                scene.add(box);
            }
        }

        function updateGunModel() {
            if (gunMesh) camera.remove(gunMesh);
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1.2);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5 });
            gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.35, -0.28, -0.55);
            camera.add(gunMesh);
            scene.add(camera);
        }

        function createEnemy() {
            const group = new THREE.Group();
            const headGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            group.add(head);

            const bodyGeo = new THREE.BoxGeometry(0.75, 1.0, 0.45);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            group.add(body);

            group.position.x = (Math.random() - 0.5) * 35;
            group.position.y = 0;
            group.position.z = -Math.random() * 25 - 10;

            group.baseSpeed = (0.018 + Math.random() * 0.009) * difficultyMultiplier;
            scene.add(group);
            enemies.push(group);
        }

        function jumpPlayer() {
            if (isJumping) return;
            isJumping = true;
            camera.position.y = 3.4;
            setTimeout(() => {
                camera.position.y = 1.8;
                isJumping = false;
            }, 320);
        }

        function shoot() {
            if (isGameOver) return;

            if (gunMesh) {
                gunMesh.position.z += 0.15;
                setTimeout(() => gunMesh.position.z -= 0.15, 60);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                if (camera.position.distanceTo(enemy.position) < 35) {
                    playerHp = 100;
                    document.getElementById("hpBar").style.width = "100%";

                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    
                    score += 1;
                    document.getElementById("score").innerText = score;

                    setTimeout(createEnemy, 300);
                    break;
                }
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            if (joystickActive) {
                const moveSpeed = 0.085;
                camera.position.x += (Math.sin(playerAngle) * joystickY - Math.cos(playerAngle) * joystickX) * moveSpeed;
                camera.position.z += (Math.cos(playerAngle) * joystickY + Math.sin(playerAngle) * joystickX) * moveSpeed;
            }

            enemies.forEach(enemy => {
                enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
                enemy.translateZ(enemy.baseSpeed);

                if (camera.position.distanceTo(enemy.position) < 1.6) {
                    playerHp -= 0.9 * difficultyMultiplier;
                    document.getElementById("hpBar").style.width = Math.max(0, playerHp) + "%";

                    if (playerHp <= 0) {
                        triggerGameOver();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById("gameUI").style.display = "none";
            document.getElementById("finalScoreText").innerText = `حصيلة القتلى النهائية: ${score}`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function resetGameData() {
            isGameOver = false;
            score = 0;
            playerHp = 100;
            playerAngle = 0;
            playerPitch = 0;
            camera.position.set(0, 1.8, 5);
            camera.rotation.set(0, 0, 0);
            document.getElementById("score").innerText = score;
            document.getElementById("hpBar").style.width = "100%";
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            updateGunModel();
            enemies.forEach(enemy => scene.remove(enemy));
            enemies = [];
            for (let i = 0; i < 6; i++) createEnemy();
        }

        function returnToMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
