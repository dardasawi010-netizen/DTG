<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDG - تطبيق الشاحنات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #12181f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    
    /* شاشة تسجيل الدخول */
    #auth-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #12181f;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 15px;
    }
    .auth-card {
      background-color: #1e2631;
      width: 100%;
      max-width: 380px;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .auth-card h2 { color: #2e7d32; margin-bottom: 5px; }

    /* التطبيق الرئيسي */
    .app-container {
      width: 100%;
      max-width: 500px;
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    .header-card {
      background-color: #1e2631;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2d3748;
    }
    .header-card h1 {
      font-size: 1.1rem;
      color: #2e7d32;
    }
    .tdg-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #3182ce;
      background: #12181f;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
    }

    /* مربعات الخيارات الرئيسية */
    .main-options {
      display: flex;
      gap: 10px;
    }
    .option-box {
      flex: 1;
      background-color: #1e2631;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .option-box:hover {
      border-color: #2e7d32;
      background-color: #252f3e;
    }
    .option-box span {
      font-size: 0.85rem;
      font-weight: bold;
      color: #48bb78;
    }

    /* النوافذ المنبثقة (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }
    .modal-content {
      background-color: #1e2631;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 { color: #f0f4f8; font-size: 1.05rem; }
    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background-color: #12181f;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: #2e7d32; }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit { background-color: #2e7d32; color: white; }
    .btn-close { background-color: #4a5568; color: white; }

    /* مجموعة المحادثة العامة لكل الناس */
    .chat-group-section {
      background-color: #1e2631;
      border-radius: 12px;
      border: 1px solid #2d3748;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-box {
      height: 180px;
      background: #12181f;
      border-radius: 8px;
      border: 1px solid #2d3748;
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-msg {
      background: #252f3e;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-word;
    }
    .chat-msg strong { color: #48bb78; }

    /* قائمة الطلبات */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .truck-card {
      background-color: #1e2631;
      border-radius: 10px;
      padding: 14px;
      border-right: 4px solid #3182ce;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .truck-card.accepted {
      border-right-color: #e53e3e;
      opacity: 0.7;
    }
    .card-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .badge {
      background: #2d3748;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .btn-accept {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-accept:disabled {
      background-color: #4a5568;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول الإجبارية -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>تسجيل الدخول - TDG</h2>
      <p style="font-size: 0.85rem; color: #a0aec0;">يرجى إدخال رقم الهاتف أو البريد الإلكتروني للمتابعة</p>
      <input type="text" id="authInput" class="form-control" placeholder="رقم الهاتف أو البريد الإلكتروني">
      <button class="btn btn-submit" onclick="loginUser()">دخول للتطبيق</button>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="app-container" id="appMain">
    <div class="header-card">
      <h1>🚚 تطبيق الشاحنات</h1>
      <div class="tdg-title">TDG</div>
    </div>

    <!-- مربعات الخيارات الرئيسية -->
    <div class="main-options">
      <div class="option-box" onclick="openShipmentModal()">
        <span style="font-size: 1.5rem;">📦</span>
        <span>إرسال طلب شحن</span>
      </div>
      <div class="option-box" onclick="openWhatsappModal()">
        <span style="font-size: 1.5rem;">💬</span>
        <span>مراسلة واتساب</span>
      </div>
    </div>

    <!-- مجموعة دردشة جماعية لكل المستخدمين -->
    <div class="chat-group-section">
      <h3 style="font-size: 0.95rem; color: #a0aec0;">💬 مجموعة دردشة عملاء وسائقي TDG</h3>
      <div class="chat-box" id="groupChatBox"></div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="groupMsgInput" class="form-control" placeholder="اكتب رسالة للجميع...">
        <button class="btn btn-submit" style="width: 80px;" onclick="sendGroupMessage()">إرسال</button>
      </div>
    </div>

    <!-- قائمة الطلبات المتاحة للجميع -->
    <h3 style="font-size: 0.95rem; color: #a0aec0;">الطلبات والشاحنات المنشورة للجميع:</h3>
    <div class="feed-container" id="requestsFeed"></div>
  </div>

  <!-- نافذة طلب الشحن -->
  <div class="modal" id="shipmentModal">
    <div class="modal-content">
      <h3>إرسال طلب شحن جديد</h3>
      <label style="font-size: 0.8rem; color:#a0aec0;">نوع الشاحنة:</label>
      <select id="truckType" class="form-control">
        <option value="تريلا قاطرة ومقطورة">تريلا (قاطرة ومقطورة)</option>
        <option value="رأس تريلا">رأس تريلا</option>
        <option value="ديانا / شاحنة صغيرة">ديانا (شاحنة صغيرة)</option>
        <option value="سكس / شاحنة متوسطة">سكس (شاحنة متوسطة)</option>
      </select>

      <label style="font-size: 0.8rem; color:#a0aec0;">عدد الأطنان:</label>
      <input type="number" id="tons" class="form-control" placeholder="مثال: 25">

      <label style="font-size: 0.8rem; color:#a0aec0;">رقم الشاحنة (اللوحة):</label>
      <input type="text" id="truckNo" class="form-control" placeholder="مثال: 12-34567">

      <label style="font-size: 0.8rem; color:#a0aec0;">الموقع الحالي:</label>
      <input type="text" id="currentLocation" class="form-control" placeholder="مثال: عمان">

      <label style="font-size: 0.8rem; color:#a0aec0;">الوجهة (إلى أين ذاهبة):</label>
      <input type="text" id="destination" class="form-control" placeholder="مثال: العقبة">

      <div class="modal-buttons">
        <button class="btn btn-submit" onclick="sendTruckRequest()">تأكيد ونشر للجميع</button>
        <button class="btn btn-close" onclick="closeShipmentModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة واتساب -->
  <div class="modal" id="whatsappModal">
    <div class="modal-content">
      <h3>مراسلة عبر واتساب</h3>
      <label style="font-size: 0.8rem; color:#a0aec0;">يجب كتابة رقم الهاتف (مع رمز الدولة):</label>
      <input type="tel" id="wa-phone" class="form-control" placeholder="مثال: 962790000000">

      <label style="font-size: 0.8rem; color:#a0aec0;">الرسالة:</label>
      <input type="text" id="wa-msg" class="form-control" placeholder="مرحباً...">

      <div class="modal-buttons">
        <button class="btn btn-submit" onclick="openWhatsappChat()">فتح الواتساب</button>
        <button class="btn btn-close" onclick="closeWhatsappModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBVrJk-B6COMjBWhXXhie-NpZihWLG8RSk",
      authDomain: "trucksapp-24ad7.firebaseapp.com",
      projectId: "trucksapp-24ad7",
      storageBucket: "trucksapp-24ad7.firebasestorage.app",
      messagingSenderId: "254565994313",
      appId: "1:254565994313:web:5df17e62fb68d94a9dd498",
      measurementId: "G-Z5K2C79V50",
      databaseURL: "https://trucksapp-24ad7-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const requestsRef = database.ref('tdg_truck_requests');
    const groupChatRef = database.ref('tdg_group_chat');

    let currentUser = "";

    // تشغيل صوت تنبيهي (تأثير صوتي عند النقر أو النشر)
    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // تردد صوت تنبيهي ناعم
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio not supported");
      }
    }

    // تسجيل الدخول
    function loginUser() {
      const val = document.getElementById('authInput').value.trim();
      if (!val) {
        alert("يرجى إدخال رقم الهاتف أو البريد الإلكتروني للمتابعة.");
        return;
      }
      currentUser = val;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('appMain').style.display = 'flex';
      playBeepSound();
    }

    // التحكم بالنوافذ المنبثقة
    function openShipmentModal() { document.getElementById('shipmentModal').style.display = 'flex'; }
    function closeShipmentModal() { document.getElementById('shipmentModal').style.display = 'none'; }
    function openWhatsappModal() { document.getElementById('whatsappModal').style.display = 'flex'; }
    function closeWhatsappModal() { document.getElementById('whatsappModal').style.display = 'none'; }

    // إرسال طلب الشحن ونشره للجميع بصدق
    function sendTruckRequest() {
      const truckType = document.getElementById('truckType').value;
      const tons = document.getElementById('tons').value.trim();
      const truckNo = document.getElementById('truckNo').value.trim();
      const currentLocation = document.getElementById('currentLocation').value.trim();
      const destination = document.getElementById('destination').value.trim();

      if (!tons || !truckNo || !currentLocation || !destination) {
        alert('الرجاء تعبئة جميع الحقول بدقة.');
        return;
      }

      playBeepSound(); // تشغيل الصوت عند التأكيد والنشر

      requestsRef.push({
        sender: currentUser,
        truckType: truckType,
        tons: tons,
        truckNo: truckNo,
        currentLocation: currentLocation,
        destination: destination,
        status: 'open',
        timestamp: Date.now()
      });

      document.getElementById('tons').value = '';
      document.getElementById('truckNo').value = '';
      document.getElementById('currentLocation').value = '';
      document.getElementById('destination').value = '';
      closeShipmentModal();
      alert('تم إرسال الطلب ونشره بنجاح لجميع المستخدمين!');
    }

    // مراسلة الواتساب (إلزامية إدخال الرقم)
    function openWhatsappChat() {
      const phone = document.getElementById('wa-phone').value.trim().replace(/[^0-9]/g, '');
      const msg = encodeURIComponent(document.getElementById('wa-msg').value.trim());

      if (!phone) {
        alert('يجب كتابة رقم الهاتف بشكل صحيح مع رمز الدولة!');
        return;
      }
      playBeepSound();
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
      closeWhatsappModal();
    }

    // مجموعة الدردشة الجماعية لكل الناس
    function sendGroupMessage() {
      const text = document.getElementById('groupMsgInput').value.trim();
      if (!text) return;

      playBeepSound();
      groupChatRef.push({
        user: currentUser,
        text: text,
        timestamp: Date.now()
      });
      document.getElementById('groupMsgInput').value = '';
    }

    // استقبال رسائل المجموعة الجماعية
    groupChatRef.on('child_added', (snapshot) => {
      const data = snapshot.val();
      const chatBox = document.getElementById('groupChatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // قبول وحجز الطلب
    function acceptRequest(key) {
      playBeepSound();
      database.ref('tdg_truck_requests/' + key).update({
        status: 'accepted',
        acceptedBy: currentUser
      });
    }

    // الاستماع الفوري للطلبات لجميع الهواتف
    requestsRef.on('value', (snapshot) => {
      const feed = document.getElementById('requestsFeed');
      feed.innerHTML = '';

      snapshot.forEach((childSnapshot) => {
        const key = childSnapshot.key;
        const data = childSnapshot.val();

        const card = document.createElement('div');
        card.className = `truck-card ${data.status === 'accepted' ? 'accepted' : ''}`;

        card.innerHTML = `
          <div class="card-info">
            <strong>🚚 ${data.truckType}</strong>
            <span class="badge">اللوحة: ${data.truckNo}</span>
          </div>
          <div class="card-info">
            <span>⚖️ الأطنان: <strong>${data.tons} طن</strong></span>
            <span>الحالة: ${data.status === 'accepted' ? '<span style="color:#e53e3e">محجوزة 🔒</span>' : '<span style="color:#38a169">متاح 🟢</span>'}</span>
          </div>
          <div style="font-size: 0.85rem; color: #a0aec0; border-top: 1px solid #2d3748; padding-top: 6px;">
            📍 من: ${data.currentLocation} ➔ إلى: ${data.destination}
          </div>
          <div style="font-size: 0.75rem; color: #718096;">الناشر: ${data.sender}</div>
          <button class="btn-accept" ${data.status === 'accepted' ? 'disabled' : ''} onclick="acceptRequest('${key}')">
            ${data.status === 'accepted' ? 'تم الحجز' : 'أنا أقبل (حجز الشاحنة)'}
          </button>
        `;

        feed.prepend(card);
      });
    });
  </script>

</body>
</html>
