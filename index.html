<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDT - لعبة الطخ بنمط بكسل ماين كرافت</title>
    <style>
        /* فرض نمط البكسل الحاد لجميع العناصر */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e293b;
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
        }
        h1 {
            font-size: 45px;
            color: #facc15;
            margin-bottom: 5px;
            letter-spacing: 4px;
            text-shadow: 4px 4px 0px #000;
        }
        .menu-btn {
            background: #16a34a;
            color: white;
            border: 4px solid #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 0px; /* بكسل حاد */
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 6px 0px #14532d;
            transition: 0.05s;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #14532d;
        }
        .options-box {
            background: #0f172a;
            padding: 15px 20px;
            border: 4px solid #475569;
            margin-bottom: 15px;
            text-align: right;
            max-width: 420px;
        }
        .select-group {
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #cbd5e1;
            font-weight: bold;
        }
        select {
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 0px;
            outline: none;
            cursor: pointer;
        }

        #gameUI {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-top {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 0 20px;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
        }
        .hud-box {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            background: #1e293b;
            padding: 6px 12px;
            border: 3px solid #000;
            box-shadow: 0 3px 0px #000;
        }
        
        /* أشرطة بكسلية بارزة */
        .bar-container {
            width: 100%;
            max-width: 500px;
            height: 14px;
            background: #0f172a;
            border: 3px solid #000;
            overflow: hidden;
            box-shadow: 0 3px 0px rgba(0,0,0,0.5);
        }
        #hpBar {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.15s steps(10);
        }
        #xpBar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.2s steps(10);
        }

        /* علامة القنص البكسلية */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
            z-index: 25;
        }

        /* منظار السكوب الكلاسيكي */
        #scopeOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        .scope-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px 100px rgba(0, 0, 0, 0.98);
        }
        .scope-crosshair-h {
            position: absolute;
            top: 50%; left: 10%; width: 80%; height: 4px;
            background: #ef4444;
            transform: translateY(-50%);
        }
        .scope-crosshair-v {
            position: absolute;
            top: 10%; left: 50%; width: 4px; height: 80%;
            background: #ef4444;
            transform: translateX(-50%);
        }

        .game-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 20;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            border: 4px solid #000;
            border-radius: 0px; /* بكسل حاد */
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            box-shadow: 0 5px 0px #000;
        }
        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #000;
        }
        #shootBtn { background: #dc2626; }
        #scopeBtn { background: #0284c7; }
    </style>
    <!-- مكتبة Three.js الخفيفة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="mainMenu" class="screen">
        <h1>TDT</h1>
        <p style="color: #facc15; margin-bottom: 15px; font-size: 14px; font-weight: bold;">عالم الطخ البكسلي (ماين كرافت ستايل)</p>
        
        <div class="options-box">
            <div class="select-group">
                <label>👤 الشخصية:</label>
                <select id="charSelect">
                    <option value="soldier">البطل السريع</option>
                    <option value="sniper">القناص الدقيق</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔫 السلاح:</label>
                <select id="weaponSelect">
                    <option value="pistol">مسدس كلاسيكي</option>
                    <option value="rifle">رشاش بكسل</option>
                    <option value="shotgun">شوتجان ثقيل</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔥 الصعوبة:</label>
                <select id="difficultySelect">
                    <option value="easy">سهل (Easy)</option>
                    <option value="normal" selected>عادي (Normal)</option>
                    <option value="hard">صعب (Hard)</option>
                    <option value="extreme">متطرف (Extreme)</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔊 الموسيقى:</label>
                <select id="audioSelect" onchange="toggleAudio(this.value)">
                    <option value="on">مفعل</option>
                    <option value="off">صامت</option>
                </select>
            </div>
        </div>

        <button class="menu-btn" onclick="startGame()">ابلاي (PLAY) 🚀</button>
    </div>

    <!-- واجهة اللعب -->
    <div id="gameUI">
        <div class="hud-top">
            <div class="hud-row">
                <div class="hud-box">النقاط: <span id="score">0</span></div>
                <div class="hud-box">المستوى: <span id="level">1</span></div>
            </div>
            <div style="width: 100%; max-width: 500px; text-align: right; font-size: 10px; color: #fff; font-weight: bold;">صحة البطل (HP) - تتعبى فل مع كل طخة!</div>
            <div class="bar-container"><div id="hpBar"></div></div>
            <div style="width: 100%; max-width: 500px; text-align: right; font-size: 10px; color: #fff; font-weight: bold; margin-top: 2px;">مؤشر الخبرة (XP)</div>
            <div class="bar-container"><div id="xpBar"></div></div>
        </div>

        <div id="crosshair">+</div>

        <div id="scopeOverlay">
            <div class="scope-vignette"></div>
            <div class="scope-crosshair-h"></div>
            <div class="scope-crosshair-v"></div>
        </div>

        <div class="game-controls">
            <button class="control-btn" id="scopeBtn" onclick="toggleScope()">🔭 سكوب</button>
            <button class="control-btn" id="shootBtn" onclick="shoot()">🔥 أطلق</button>
        </div>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen" class="screen" style="display: none; background: #450a0a; border: 8px solid #7f1d1d;">
        <h1 style="color: #f87171; font-size: 38px; text-shadow: 3px 3px 0px #000;">لقد خسرت يا اهبل</h1>
        <p id="finalScoreText" style="font-size: 18px; margin-bottom: 20px; color: #fef08a; font-weight: bold;"></p>
        <button class="menu-btn" style="background: #ca8a04; box-shadow: 0 5px 0px #713f12;" onclick="returnToMenu()">إعادة المحاولة 🔄</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-cute.mp3" type="audio/mp3">
    </audio>

    <script>
        let scene, camera, renderer;
        let bots = [];
        let score = 0;
        let level = 1;
        let xp = 0;
        let maxXp = 500;
        let playerHp = 100;
        let difficultyMultiplier = 1.0;
        let isGameOver = false;
        let isScoped = false;
        let audioEnabled = true;
        let gunMesh = null;

        const bgMusic = document.getElementById("bgMusic");
        bgMusic.volume = 0.2;

        function toggleAudio(val) {
            audioEnabled = (val === "on");
            if(audioEnabled) bgMusic.play().catch(() => {});
            else bgMusic.pause();
        }

        function startGame() {
            const diff = document.getElementById("difficultySelect").value;
            if (diff === 'easy') difficultyMultiplier = 0.7;
            else if (diff === 'normal') difficultyMultiplier = 1.0;
            else if (diff === 'hard') difficultyMultiplier = 1.5;
            else if (diff === 'extreme') difficultyMultiplier = 2.2;

            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});

            if (!scene) {
                init3D();
            } else {
                resetGameData();
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38bdf8); // سماء بكسلية زرقاء

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            // أرضية بنمط بكسل العشب (أخضر فاقع)
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x16a34a });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // جدار الخلفية البكسلي
            const wallGeo = new THREE.PlaneGeometry(80, 30);
            const wallMat = new THREE.MeshBasicMaterial({ color: 0x991b1b });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 15, -30);
            scene.add(wall);

            updateGunModel();

            for (let i = 0; i < 4; i++) {
                createBot();
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function updateGunModel() {
            if (gunMesh) camera.remove(gunMesh);

            const weaponType = document.getElementById("weaponSelect").value;
            let gunColor = 0xb45309; // لون خشبي بكسل
            let width = 0.25, height = 0.25, length = 0.8;

            if(weaponType === 'rifle') { length = 1.2; gunColor = 0x334155; } 
            else if(weaponType === 'shotgun') { length = 1.0; width = 0.35; gunColor = 0xb91c1c; }

            const gunGeo = new THREE.BoxGeometry(width, height, length);
            const gunMat = new THREE.MeshBasicMaterial({ color: gunColor });
            gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.3, -0.28, -0.6);
            camera.add(gunMesh);
            scene.add(camera);
        }

        function createBot() {
            // تصميم البوت بمكعبات بكسلية بارزة تشبه شخصيات ماين كرافت
            const botGeo = new THREE.BoxGeometry(1.2, 1.8, 1.2);
            const botColors = [0xeab308, 0x9333ea, 0x2563eb, 0x0d9488];
            const botMat = new THREE.MeshBasicMaterial({ color: botColors[Math.floor(Math.random() * botColors.length)] });
            
            const bot = new THREE.Mesh(botGeo, botMat);
            bot.position.x = (Math.random() - 0.5) * 20;
            bot.position.y = 0.9;
            bot.position.z = -Math.random() * 18 - 5;
            
            bot.baseSpeed = (0.015 + Math.random() * 0.015) * difficultyMultiplier + (level - 1) * 0.003;
            bot.aiTimer = Math.random() * 100;
            bot.aiPattern = Math.floor(Math.random() * 3);

            scene.add(bot);
            bots.push(bot);
        }

        function createSplatter(x, y, z, isWall = false) {
            const splatterGeo = new THREE.PlaneGeometry(0.4, 0.4); // شكل بكسلي مربع
            const splatterColors = [0xffffff, 0xfde047, 0x22d3ee, 0xf43f5e, 0x4ade80];
            const splatterMat = new THREE.MeshBasicMaterial({ 
                color: splatterColors[Math.floor(Math.random() * splatterColors.length)], 
                side: THREE.DoubleSide 
            });
            const splatter = new THREE.Mesh(splatterGeo, splatterMat);

            if (isWall) {
                splatter.position.set(x, y, -29.8);
            } else {
                splatter.position.set(x, 0.03, z);
                splatter.rotation.x = -Math.PI / 2;
            }
            scene.add(splatter);
        }

        function toggleScope() {
            isScoped = !isScoped;
            const scopeOverlay = document.getElementById("scopeOverlay");
            
            if (isScoped) {
                scopeOverlay.style.display = "block";
                camera.fov = 25;
            } else {
                scopeOverlay.style.display = "none";
                camera.fov = 75;
            }
            camera.updateProjectionMatrix();
        }

        function shoot() {
            if (isGameOver) return;

            if (gunMesh) {
                gunMesh.position.z += 0.1;
                setTimeout(() => gunMesh.position.z -= 0.1, 80);
            }

            createSplatter(camera.position.x + (Math.random() - 0.5) * 4, 0, camera.position.z - 3, false);

            for (let i = bots.length - 1; i >= 0; i--) {
                let bot = bots[i];
                if (camera.position.distanceTo(bot.position) < 20) {
                    // عندما تطخ عدداً: دمك يصير فل 100%
                    playerHp = 100;
                    document.getElementById("hpBar").style.width = "100%";

                    createSplatter(bot.position.x, 1, 0, true);
                    createSplatter(bot.position.x, 0, bot.position.z, false);

                    scene.remove(bot);
                    bots.splice(i, 1);
                    
                    score += 100 * difficultyMultiplier;
                    xp += 100;

                    if (xp >= maxXp) {
                        xp = 0;
                        level++;
                        maxXp += 250;
                        document.getElementById("level").innerText = level;
                    }

                    document.getElementById("xpBar").style.width = ((xp / maxXp) * 100) + "%";
                    document.getElementById("score").innerText = Math.floor(score);

                    setTimeout(createBot, 500);
                    break;
                }
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            bots.forEach(bot => {
                bot.position.z += bot.baseSpeed;
                bot.aiTimer += 0.05;

                if (bot.aiPattern === 0) {
                    bot.position.x += Math.sin(bot.aiTimer) * 0.04;
                } else if (bot.aiPattern === 1) {
                    bot.position.x += Math.cos(bot.aiTimer * 1.5) * 0.06;
                } else {
                    if (bot.position.x < camera.position.x) bot.position.x += 0.015;
                    else bot.position.x -= 0.015;
                }

                if (bot.position.z > camera.position.z - 1.5) {
                    playerHp -= 0.6 * difficultyMultiplier;
                    document.getElementById("hpBar").style.width = Math.max(0, playerHp) + "%";

                    if (playerHp <= 0) {
                        triggerGameOver();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            bgMusic.pause();
            document.getElementById("gameUI").style.display = "none";
            document.getElementById("finalScoreText").innerText = `مجموع نقاطك النهائية: ${Math.floor(score)} (المستوى: ${level})`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function resetGameData() {
            isGameOver = false;
            score = 0;
            level = 1;
            xp = 0;
            maxXp = 500;
            playerHp = 100;
            isScoped = false;
            document.getElementById("scopeOverlay").style.display = "none";
            camera.fov = 75;
            camera.updateProjectionMatrix();
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level;
            document.getElementById("xpBar").style.width = "0%";
            document.getElementById("hpBar").style.width = "100%";
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});
            updateGunModel();

            bots.forEach(bot => scene.remove(bot));
            bots = [];
            for (let i = 0; i < 4; i++) createBot();
        }

        function returnToMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
