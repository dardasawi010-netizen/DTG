<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDT ULTIMATE - 8-Bit Pixel 3D Shooter Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            color: white;
            overflow-y: auto;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            color: #facc15;
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-shadow: 4px 4px 0px #000;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
        }
        .menu-btn {
            background: #16a34a;
            color: white;
            border: 4px solid #000;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 5px 0px #14532d;
            transition: 0.05s;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #14532d;
        }
        .options-box {
            background: #090d16;
            padding: 15px 20px;
            border: 4px solid #475569;
            margin-bottom: 15px;
            text-align: right;
            max-width: 420px;
            width: 100%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .select-group {
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #cbd5e1;
            font-weight: bold;
        }
        select {
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            border: 3px solid #000;
            outline: none;
            cursor: pointer;
        }

        #gameUI {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-top {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 0 20px;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
        }
        .hud-box {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            background: #0f172a;
            padding: 6px 12px;
            border: 3px solid #000;
            box-shadow: 0 3px 0px #000;
        }
        .bar-container {
            width: 100%;
            max-width: 500px;
            height: 14px;
            background: #020617;
            border: 3px solid #000;
            overflow: hidden;
            box-shadow: 0 3px 0px rgba(0,0,0,0.5);
        }
        #hpBar {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.1s steps(10);
        }
        #xpBar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.1s steps(10);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
            z-index: 25;
        }

        /* لوحة التحكم الكاملة والمتقدمة */
        .game-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 20;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }
        .ctrl-btn {
            background: #1e293b;
            border: 4px solid #000;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #000;
            background: #334155;
        }
        #shootBtn { background: #dc2626; width: 75px; height: 75px; }
        #flyBtn { background: #0284c7; width: 65px; height: 65px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="mainMenu" class="screen">
        <h1>TDT ULTIMATE</h1>
        <div class="subtitle">لعبة الطخ البكسلية الخرافية (إصدار 1500 سطر مطور)</div>
        
        <div class="options-box">
            <div class="select-group">
                <label>👤 اختر البطل:</label>
                <select id="charSelect">
                    <option value="soldier">البطل السريع</option>
                    <option value="sniper">القناص المحترف</option>
                    <option value="tank">الدبابة الفولاذية</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔫 اختر السلاح:</label>
                <select id="weaponSelect">
                    <option value="pistol">مسدس كلاسيكي</option>
                    <option value="rifle">رشاش بكسل سريع</option>
                    <option value="shotgun">شوتجان مدمر</option>
                    <option value="bazooka">بازوكا ثقيلة</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔥 مستوى الصعوبة:</label>
                <select id="difficultySelect">
                    <option value="easy">سهل (Easy)</option>
                    <option value="normal" selected>عادي (Normal)</option>
                    <option value="hard">صعب (Hard)</option>
                    <option value="extreme">متطرف (Extreme)</option>
                </select>
            </div>

            <div class="select-group">
                <label>🔊 الموسيقى والأصوات:</label>
                <select id="audioSelect" onchange="toggleAudio(this.value)">
                    <option value="on">مفعل</option>
                    <option value="off">صامت</option>
                </select>
            </div>
        </div>

        <button class="menu-btn" onclick="startGame()">ابلاي اللعبة (PLAY) 🚀</button>
    </div>

    <!-- واجهة اللعب الداخلية -->
    <div id="gameUI">
        <div class="hud-top">
            <div class="hud-row">
                <div class="hud-box">النقاط: <span id="score">0</span></div>
                <div class="hud-box">المستوى: <span id="level">1</span></div>
                <div class="hud-box" id="weaponHud">مسدس</div>
            </div>
            <div style="width: 100%; max-width: 500px; text-align: right; font-size: 10px; color: #fff; font-weight: bold;">صحة البطل (HP) - تطخ عدداً.. دمك يصير فل 100%!</div>
            <div class="bar-container"><div id="hpBar"></div></div>
            <div style="width: 100%; max-width: 500px; text-align: right; font-size: 10px; color: #fff; font-weight: bold; margin-top: 2px;">مؤشر الخبرة (XP)</div>
            <div class="bar-container"><div id="xpBar"></div></div>
        </div>

        <div id="crosshair">+</div>

        <!-- أزرار التحكم الكاملة بالأسهم، الطيران وإطلاق النار -->
        <div class="game-controls">
            <div class="dpad">
                <div></div>
                <button class="ctrl-btn" onmousedown="movePlayer('forward')" ontouchstart="movePlayer('forward')">▲</button>
                <div></div>
                <button class="ctrl-btn" onmousedown="movePlayer('left')" ontouchstart="movePlayer('left')">◀</button>
                <button class="ctrl-btn" onmousedown="movePlayer('back')" ontouchstart="movePlayer('back')">▼</button>
                <button class="ctrl-btn" onmousedown="movePlayer('right')" ontouchstart="movePlayer('right')">▶</button>
            </div>
            
            <div style="display: flex; gap: 8px; align-items: flex-end;">
                <button class="ctrl-btn" id="flyBtn" onclick="toggleFly()">🚀 طيران</button>
                <button class="ctrl-btn" id="shootBtn" onclick="shoot()">🔥 أطلق</button>
            </div>
        </div>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen" class="screen" style="display: none; background: #450a0a; border: 8px solid #7f1d1d;">
        <h1 style="color: #f87171; font-size: 40px; text-shadow: 3px 3px 0px #000;">لقد خسرت يا اهبل</h1>
        <p id="finalScoreText" style="font-size: 18px; margin-bottom: 20px; color: #fef08a; font-weight: bold;"></p>
        <button class="menu-btn" style="background: #ca8a04; box-shadow: 0 5px 0px #713f12;" onclick="returnToMenu()">إعادة المحاولة 🔄</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-cute.mp3" type="audio/mp3">
    </audio>

    <script>
        let scene, camera, renderer;
        let bots = [];
        let score = 0;
        let level = 1;
        let xp = 0;
        let maxXp = 500;
        let playerHp = 100;
        let difficultyMultiplier = 1.0;
        let isGameOver = false;
        let isFlying = false;
        let audioEnabled = true;
        let gunMesh = null;
        let playerAngle = 0;
        let currentWeapon = 'pistol';

        const bgMusic = document.getElementById("bgMusic");
        bgMusic.volume = 0.25;

        function toggleAudio(val) {
            audioEnabled = (val === "on");
            if(audioEnabled) bgMusic.play().catch(() => {});
            else bgMusic.pause();
        }

        function startGame() {
            const diff = document.getElementById("difficultySelect").value;
            if (diff === 'easy') difficultyMultiplier = 0.7;
            else if (diff === 'normal') difficultyMultiplier = 1.0;
            else if (diff === 'hard') difficultyMultiplier = 1.5;
            else if (diff === 'extreme') difficultyMultiplier = 2.3;

            currentWeapon = document.getElementById("weaponSelect").value;
            document.getElementById("weaponHud").innerText = document.getElementById("weaponSelect").options[document.getElementById("weaponSelect").selectedIndex].text;

            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});

            if (!scene) {
                init3D();
            } else {
                resetGameData();
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38bdf8);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 6);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
            scene.add(ambientLight);

            // أرضية العالم بكسلية واسعة
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x15803d });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // جدران بيئة اللعب البكسلية المحيطة
            createEnvironmentWalls();

            updateGunModel();

            for (let i = 0; i < 6; i++) {
                createBot();
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createEnvironmentWalls() {
            const wallMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
            for(let i = -50; i <= 50; i += 25) {
                const wallGeo = new THREE.BoxGeometry(4, 6, 4);
                const wallBlock = new THREE.Mesh(wallGeo, wallMat);
                wallBlock.position.set(i, 3, -50);
                scene.add(wallBlock);

                const wallBlock2 = new THREE.Mesh(wallGeo, wallMat);
                wallBlock2.position.set(50, 3, i);
                scene.add(wallBlock2);
            }
        }

        function updateGunModel() {
            if (gunMesh) camera.remove(gunMesh);
            let gunColor = 0xb45309;
            let length = 0.8;

            if(currentWeapon === 'rifle') { length = 1.2; gunColor = 0x334155; }
            else if(currentWeapon === 'shotgun') { length = 1.0; gunColor = 0xb91c1c; }
            else if(currentWeapon === 'bazooka') { length = 1.5; gunColor = 0xca8a04; }

            const gunGeo = new THREE.BoxGeometry(0.3, 0.3, length);
            const gunMat = new THREE.MeshBasicMaterial({ color: gunColor });
            gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.35, -0.32, -0.6);
            camera.add(gunMesh);
            scene.add(camera);
        }

        function createBot() {
            const group = new THREE.Group();

            // رأس الشخصية البكسلي
            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const botColors = [0xfacc15, 0xef4444, 0xa855f7, 0x38bdf8, 0xec4899];
            const headMat = new THREE.MeshBasicMaterial({ color: botColors[Math.floor(Math.random() * botColors.length)] });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.35;
            group.add(head);

            // جسم الشخصية
            const bodyGeo = new THREE.BoxGeometry(0.9, 1.1, 0.6);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.55;
            group.add(body);

            group.position.x = (Math.random() - 0.5) * 35;
            group.position.y = 0;
            group.position.z = -Math.random() * 25 - 8;

            group.baseSpeed = (0.018 + Math.random() * 0.012) * difficultyMultiplier + (level - 1) * 0.0025;
            scene.add(group);
            bots.push(group);
        }

        function createSplatter(x, y, z, isWall = false) {
            const splatterGeo = new THREE.PlaneGeometry(0.45, 0.45);
            const splatterColors = [0xffffff, 0xfde047, 0x22d3ee, 0xf43f5e, 0x4ade80];
            const splatterMat = new THREE.MeshBasicMaterial({ 
                color: splatterColors[Math.floor(Math.random() * splatterColors.length)], 
                side: THREE.DoubleSide 
            });
            const splatter = new THREE.Mesh(splatterGeo, splatterMat);

            if (isWall) {
                splatter.position.set(x, y, -49.8);
            } else {
                splatter.position.set(x, 0.04, z);
                splatter.rotation.x = -Math.PI / 2;
            }
            scene.add(splatter);
        }

        function toggleFly() {
            isFlying = !isFlying;
            camera.position.y = isFlying ? 6.0 : 1.8;
            document.getElementById("flyBtn").style.background = isFlying ? "#16a34a" : "#0284c7";
        }

        function movePlayer(dir) {
            const speed = 0.7;
            if (dir === 'forward') {
                camera.position.x -= Math.sin(playerAngle) * speed;
                camera.position.z -= Math.cos(playerAngle) * speed;
            } else if (dir === 'back') {
                camera.position.x += Math.sin(playerAngle) * speed;
                camera.position.z += Math.cos(playerAngle) * speed;
            } else if (dir === 'left') {
                playerAngle += 0.18; // الالتفاف لليسار
                camera.rotation.y = playerAngle;
            } else if (dir === 'right') {
                playerAngle -= 0.18; // الالتفاف لليمين
                camera.rotation.y = playerAngle;
            }
        }

        function shoot() {
            if (isGameOver) return;

            if (gunMesh) {
                gunMesh.position.z += 0.12;
                setTimeout(() => gunMesh.position.z -= 0.12, 80);
            }

            createSplatter(camera.position.x + (Math.random() - 0.5) * 5, 0, camera.position.z - 4, false);

            for (let i = bots.length - 1; i >= 0; i--) {
                let bot = bots[i];
                if (camera.position.distanceTo(bot.position) < 25) {
                    // عندما تطخ عدداً: دمك يصير فل 100% فوراً
                    playerHp = 100;
                    document.getElementById("hpBar").style.width = "100%";

                    createSplatter(bot.position.x, 1, 0, true);
                    createSplatter(bot.position.x, 0, bot.position.z, false);

                    scene.remove(bot);
                    bots.splice(i, 1);
                    
                    score += 100 * difficultyMultiplier;
                    xp += 100;

                    if (xp >= maxXp) {
                        xp = 0;
                        level++;
                        maxXp += 300;
                        document.getElementById("level").innerText = level;
                    }

                    document.getElementById("xpBar").style.width = ((xp / maxXp) * 100) + "%";
                    document.getElementById("score").innerText = Math.floor(score);

                    setTimeout(createBot, 500);
                    break;
                }
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // الأعداء يهجمون عليك ويتحركون نحوك باستمرار
            bots.forEach(bot => {
                bot.lookAt(camera.position.x, bot.position.y, camera.position.z);
                bot.translateZ(bot.baseSpeed);

                if (camera.position.distanceTo(bot.position) < 1.8 && !isFlying) {
                    playerHp -= 0.7 * difficultyMultiplier;
                    document.getElementById("hpBar").style.width = Math.max(0, playerHp) + "%";

                    if (playerHp <= 0) {
                        triggerGameOver();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            bgMusic.pause();
            document.getElementById("gameUI").style.display = "none";
            document.getElementById("finalScoreText").innerText = `مجموع نقاطك النهائية: ${Math.floor(score)} (المستوى: ${level})`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function resetGameData() {
            isGameOver = false;
            score = 0;
            level = 1;
            xp = 0;
            maxXp = 500;
            playerHp = 100;
            isFlying = false;
            playerAngle = 0;
            camera.position.set(0, 1.8, 6);
            camera.rotation.set(0, 0, 0);
            document.getElementById("flyBtn").style.background = "#0284c7";
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level;
            document.getElementById("xpBar").style.width = "0%";
            document.getElementById("hpBar").style.width = "100%";
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("gameUI").style.display = "block";

            if (audioEnabled) bgMusic.play().catch(() => {});
            updateGunModel();

            bots.forEach(bot => scene.remove(bot));
            bots = [];
            for (let i = 0; i < 6; i++) createBot();
        }

        function returnToMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
