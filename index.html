<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية - TrucksApp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #12181f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .header-card {
      background-color: #1e2631;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #2d3748;
    }
    .header-card h1 {
      font-size: 1.2rem;
      color: #2e7d32;
    }
    
    /* شريط طلب شاحنة */
    .request-form {
      background-color: #1e2631;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .request-form h3 {
      font-size: 1rem;
      color: #a0aec0;
      margin-bottom: 5px;
    }
    .form-group {
      display: flex;
      gap: 8px;
    }
    .form-control {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background-color: #12181f;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus {
      border-color: #2e7d32;
    }
    .btn-send {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .btn-send:hover {
      background-color: #256628;
    }

    /* قائمة الطلبات الشغالة */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .truck-card {
      background-color: #1e2631;
      border-radius: 10px;
      padding: 14px;
      border-right: 4px solid #3182ce;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .truck-card.accepted {
      border-right-color: #e53e3e;
      opacity: 0.7;
    }
    .card-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }
    .badge {
      background: #2d3748;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .btn-accept {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-accept:disabled {
      background-color: #4a5568;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-card">
      <h1>🚚 تطبيق الشاحنات (TrucksApp)</h1>
    </div>

    <!-- شريط إدخال الطلب -->
    <div class="request-form">
      <h3>إرسال طلب شاحنة جديد:</h3>
      <select id="truckType" class="form-control">
        <option value="">اختر نوع الشاحنة...</option>
        <option value="تريلا قاطرة ومقطورة">تريلا (قاطرة ومقطورة)</option>
        <option value="شاحنة رأس تريلا">رأس تريلا</option>
        <option value="ديانا / شاحنة صغيرة">ديانا (شاحنة صغيرة)</option>
        <option value="سكس / شاحنة متوسطة">سكس (شاحنة متوسطة)</option>
      </select>

      <div class="form-group">
        <input type="number" id="tons" class="form-control" placeholder="عدد الأطنان (مثال: 25)">
        <input type="text" id="truckNo" class="form-control" placeholder="رقم الشاحنة/اللوحة">
      </div>

      <button class="btn-send" onclick="sendTruckRequest()">إرسال الطلب لجميع الهواتف 📡</button>
    </div>

    <!-- قائمة الطلبات التي تظهر للجميع -->
    <h3 style="font-size: 1rem; color: #a0aec0; margin-top: 10px;">الطلبات المتاحة حالياً:</h3>
    <div class="feed-container" id="requestsFeed"></div>
  </div>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBVrJk-B6COMjBWhXXhie-NpZihWLG8RSk",
      authDomain: "trucksapp-24ad7.firebaseapp.com",
      projectId: "trucksapp-24ad7",
      storageBucket: "trucksapp-24ad7.firebasestorage.app",
      messagingSenderId: "254565994313",
      appId: "1:254565994313:web:5df17e62fb68d94a9dd498",
      measurementId: "G-Z5K2C79V50",
      databaseURL: "https://trucksapp-24ad7-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const requestsRef = database.ref('truck_requests');

    // إرسال الطلب لقاعدة البيانات
    function sendTruckRequest() {
      const truckType = document.getElementById('truckType').value;
      const tons = document.getElementById('tons').value.trim();
      const truckNo = document.getElementById('truckNo').value.trim();

      if (!truckType || !tons || !truckNo) {
        alert('يرجى تعبئة جميع الحقول (نوع الشاحنة، الأطنان، ورقم الشاحنة)');
        return;
      }

      requestsRef.push({
        truckType: truckType,
        tons: tons,
        truckNo: truckNo,
        status: 'open',
        timestamp: Date.now()
      });

      // تفريغ الحقول بعد الإرسال
      document.getElementById('truckType').value = '';
      document.getElementById('tons').value = '';
      document.getElementById('truckNo').value = '';
    }

    // القبول من قبل أي سائق/مستخدم
    function acceptRequest(key) {
      database.ref('truck_requests/' + key).update({
        status: 'accepted'
      });
    }

    // الاستماع المباشر وعرض الطلبات على جميع الهواتف
    requestsRef.on('value', (snapshot) => {
      const feed = document.getElementById('requestsFeed');
      feed.innerHTML = '';

      snapshot.forEach((childSnapshot) => {
        const key = childSnapshot.key;
        const data = childSnapshot.val();

        const card = document.createElement('div');
        card.className = `truck-card ${data.status === 'accepted' ? 'accepted' : ''}`;

        card.innerHTML = `
          <div class="card-info">
            <strong>🚚 ${data.truckType}</strong>
            <span class="badge">رقم: ${data.truckNo}</span>
          </div>
          <div class="card-info">
            <span>⚖️ الوزن: <strong>${data.tons} طن</strong></span>
            <span>الحالة: ${data.status === 'accepted' ? '<span style="color:#e53e3e">تم القبول 🔒</span>' : '<span style="color:#38a169">متاح 🟢</span>'}</span>
          </div>
          <button class="btn-accept" ${data.status === 'accepted' ? 'disabled' : ''} onclick="acceptRequest('${key}')">
            ${data.status === 'accepted' ? 'تم حجز هذه الشاحنة' : 'أنا أقبل (حجز)'}
          </button>
        `;

        feed.prepend(card);
      });
    });
  </script>

</body>
</html>
