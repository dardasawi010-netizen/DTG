<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماريو لوكي بلوك - تحكم بالهاتف</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h1 {
            font-size: 20px;
            margin: 5px 0;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid #f1c40f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }
        canvas {
            background: linear-gradient(to bottom, #1a252f, #2c3e50);
            display: block;
            width: 100%;
            height: auto;
        }
        /* أزرار التحكم للهاتف */
        .controls {
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 15px auto 0 auto;
            padding: 0 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: rgba(241, 196, 15, 0.2);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            font-size: 22px;
            font-weight: bold;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.1s;
        }
        .control-btn:active {
            background: rgba(241, 196, 15, 0.6);
            transform: scale(0.95);
        }
        .jump-btn {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        .jump-btn:active {
            background: rgba(46, 204, 113, 0.6);
        }
        .score-board {
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>ماريو: مغامرة لوكي بلوك 🌟</h1>
    <div class="score-board">النقاط: <span id="score">0</span> | الحظ: <span id="luckMsg">ابحث عن الصناديق الصفراء!</span></div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="350"></canvas>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
        <div class="btn-group">
            <button class="control-btn jump-btn" id="jumpBtn">🚀</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const luckMsg = document.getElementById("luckMsg");

        let score = 0;

        // خصائص ماريو
        let mario = {
            x: 50,
            y: 200,
            width: 28,
            height: 38,
            speed: 4.5,
            dx: 0,
            dy: 0,
            jumpPower: -10.5,
            grounded: false
        };

        const gravity = 0.5;

        // المنصات مصممة على شكل "لوكي بلوك" (Lucky Blocks) صفراء مرسوم عليها علامة ?
        let platforms = [
            { x: 0, y: 310, width: 600, height: 40, type: "ground" }, // الأرضية الخضراء الحجرية
            { x: 180, y: 220, width: 120, height: 35, type: "lucky" },  // لوكي بلوك 1
            { x: 380, y: 150, width: 120, height: 35, type: "lucky" }   // لوكي بلوك 2
        ];

        // تتبع حالة أزرار اللمس واللوحة
        let keys = {};

        // أحداث لوحة المفاتيح (للكمبيوتر)
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if ((e.code === "Space" || e.code === "ArrowUp") && mario.grounded) {
                jump();
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // ربط أزرار اللمس (للهاتف الذكي)
        const setupTouch = (id, code) => {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; if(id === 'jumpBtn' && mario.grounded) jump(); });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
            btn.addEventListener("mousedown", () => { keys[code] = true; if(id === 'jumpBtn' && mario.grounded) jump(); });
            btn.addEventListener("mouseup", () => { keys[code] = false; });
        };

        setupTouch("leftBtn", "ArrowLeft");
        setupTouch("rightBtn", "ArrowRight");
        setupTouch("jumpBtn", "Space");

        function jump() {
            mario.dy = mario.jumpPower;
            mario.grounded = false;
        }

        function update() {
            if (keys["ArrowRight"]) {
                mario.dx = mario.speed;
            } else if (keys["ArrowLeft"]) {
                mario.dx = -mario.speed;
            } else {
                mario.dx = 0;
            }

            mario.dy += gravity;
            mario.x += mario.dx;
            mario.y += mario.dy;

            // الحدود الجانبية
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            // فحص الاصطدام بالمنصات واللوكي بلوك
            mario.grounded = false;
            platforms.forEach(plat => {
                if (
                    mario.x < plat.x + plat.width &&
                    mario.x + mario.width > plat.x &&
                    mario.y + mario.height >= plat.y &&
                    mario.y + mario.height - mario.dy <= plat.y
                ) {
                    mario.dy = 0;
                    mario.y = plat.y - mario.height;
                    mario.grounded = true;

                    // إذا كانت المنصة لوكي بلوك وصعد عليها لأول مرة
                    if (plat.type === "lucky" && !plat.opened) {
                        plat.opened = true;
                        let luckEvents = ["+100 نقطة حظ! 🌟", "ضربة قوية! 🔥", "مفاجأة سارة! 🎁", "طفرة نقاط! 💎"];
                        let randomEvent = luckEvents[Math.floor(Math.random() * luckEvents.length)];
                        luckMsg.innerText = randomEvent;
                        score += 100;
                        scoreElement.innerText = score;
                        plat.color = "#7f8c8d"; // يتحول لون البلوك للرمادي بعد فتحه
                    }
                }
            });

            // السقوط بالخارج
            if (mario.y > canvas.height) {
                resetGame();
            }
        }

        function resetGame() {
            mario.x = 50;
            mario.y = 200;
            mario.dy = 0;
            luckMsg.innerText = "لقد سقطت! حاول مجدداً";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم المنصات واللوكي بلوك
            platforms.forEach(plat => {
                if (plat.type === "ground") {
                    ctx.fillStyle = "#27ae60";
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    // تفاصيل حجرية بالأعلى
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(plat.x, plat.y, plat.width, 8);
                } else {
                    // شكل اللوكي بلوك الأصفر المميز
                    ctx.fillStyle = plat.opened ? "#7f8c8d" : "#f1c40f";
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    
                    // إطار الحدود للوكي بلوك
                    ctx.strokeStyle = "#d35400";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);

                    // كتابة علامة الاستفهام (?) في منتصف الصندوق
                    if (!plat.opened) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 20px Arial";
                        ctx.fillText("?", plat.x + plat.width / 2 - 6, plat.y + 24);
                    }
                }
            });

            // رسم شخصية ماريو الواقعية بتفاصيل أنيق ومجسمة
            // الجسم (القميص أو السالوبيت الأحمر والأزرق)
            ctx.fillStyle = "#e74c3c"; // أحمر ماريو
            ctx.fillRect(mario.x + 4, mario.y + 12, 20, 20);
            
            // البنطال الأزرق
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(mario.x + 6, mario.y + 24, 16, 14);

            // الوجه والقبعة
            ctx.fillStyle = "#f39c12"; // لون الوجه
            ctx.fillRect(mario.x + 6, mario.y + 2, 16, 14);
            
            ctx.fillStyle = "#c0392b"; // القبعة الحمراء
            ctx.fillRect(mario.x + 2, mario.y, 24, 6);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
